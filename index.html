<!doctype html>
<html lang="ru">
  <head><script>window.onerror = function(msg, url, lineNo, columnNo, error) { fetch('/api/log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ msg, lineNo, columnNo, stack: error ? error.stack : '' }) }); return false; }; window.addEventListener('unhandledrejection', function(event) { fetch('/api/log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ msg: event.reason.message, stack: event.reason.stack }) }); });</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Disable index.html caching to guarantee instant updates on deployment -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Lectura</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- PWA Support -->
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lectura" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <script>
      try {
        const isDark = localStorage.getItem("vocab_clone_dark_mode") === "true";
        if (isDark) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
      try {
        const saved = localStorage.getItem("vocab_clone_words");
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed === "object") {
            let modified = false;
            const cleansed = {};
            for (const [key, value] of Object.entries(parsed)) {
              if (value && typeof value === "object" && typeof value.word === "string") {
                cleansed[key] = value;
              } else {
                modified = true;
              }
            }
            if (modified) {
              localStorage.setItem("vocab_clone_words", JSON.stringify(cleansed));
              console.log("Cleaned up invalid records in localStorage.");
            }
          }
        }
      } catch (err) {
        console.error("LocalStorage pre-cleanse error:", err);
      }

      // Register Service Worker — served dynamically by Express with APP_VERSION injected
      // into CACHE_NAME so old caches are always purged on every update (fixes Edge tablet caching)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then(function(reg) {
              console.log('[SW] Registered, scope:', reg.scope);
              // Force immediate update check on every page load
              reg.update();
            })
            .catch(function(err) {
              console.warn('[SW] Registration failed:', err);
            });
        });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
