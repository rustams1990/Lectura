<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lectura — Умное чтение и изучение языков</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA Support handled by VitePWA plugin -->
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lectura" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <script>
      try {
        const isDark = localStorage.getItem("vocab_clone_dark_mode") === "true";
        if (isDark) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
      try {
        const saved = localStorage.getItem("vocab_clone_words");
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed === "object") {
            let modified = false;
            const cleansed = {};
            for (const [key, value] of Object.entries(parsed)) {
              if (value && typeof value === "object" && typeof value.word === "string") {
                cleansed[key] = value;
              } else {
                modified = true;
              }
            }
            if (modified) {
              localStorage.setItem("vocab_clone_words", JSON.stringify(cleansed));
              console.log("Cleaned up invalid records in localStorage.");
            }
          }
        }
      } catch (err) {
        console.error("LocalStorage pre-cleanse error:", err);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
