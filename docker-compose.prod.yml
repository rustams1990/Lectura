services:
  lectura:
    image: ghcr.io/rustams1990/lectura:latest
    container_name: lectura
    restart: unless-stopped
    ports:
      - "8586:3000" # Внешний порт сервера 8586, внутренний 3000
    volumes:
      # Папка для базы данных и медиа-кэша на диске сервера
      - ${DATA_PATH:-./data}:/app/data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:8586}
      - PORT=3000
      - DATA_DIR=/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Опционально: Автоматическое фоновое обновление Lectura при выходе новых версий
  watchtower:
    image: containrrr/watchtower
    container_name: lectura-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 1800 --cleanup lectura
